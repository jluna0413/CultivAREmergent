name: cultivar_app
description: A self-hosted cannabis grow journal application.
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1
  go_router: ^17.0.0
  dio: ^5.9.0
  flutter_dotenv: ^6.0.0
  image_picker: ^1.0.7
  drift: ^2.14.1
  drift_flutter: ^0.2.7
  path_provider: ^2.1.2
  connectivity_plus: ^7.0.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.2.4
  share_plus: ^12.0.1
  permission_handler: ^12.0.1
  flutter_local_notifications: ^19.5.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  web_socket_channel: ^3.0.3
  cached_network_image: ^3.4.1
  fl_chart: ^1.1.1
  intl: ^0.20.2
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  riverpod_annotation: ^2.3.5
  jwt_decoder: 2.0.1
  state_notifier: ^1.0.0
  firebase_analytics: ^12.0.4
  firebase_crashlytics: ^5.0.5
  flutter_appauth: ^11.0.0
  http: ^1.6.0
  flutter_animate: ^4.5.0
  video_player: ^2.10.1
  flutter_svg: ^2.2.3
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  integration_test:
    sdk: flutter

  riverpod_generator: ^2.4.0
  http_mock_adapter: ^0.6.1
  network_image_mock: ^2.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/manufacturers/
    - assets/videos/
    - .env
