name: Flutter CI

on:
  push:
    branches:
      - main
    paths:
      - 'flutter_app/**'
  pull_request:
    paths:
      - 'flutter_app/**'
  workflow_dispatch:

jobs:
  flutter_test:
    name: Flutter Test & Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0'

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter_app/.pub_cache
          key: ${{ runner.os }}-pub-${{ hashFiles('flutter_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze

      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run widget tests
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: flutter_app/coverage
          fail_ci_if_error: true

  flutter_build:
    name: Flutter Build
    needs: flutter_test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            build_command: 'flutter build web && flutter build apk --debug'
            artifact_name: 'build-linux'
            artifact_path: |
              flutter_app/build/web
              flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          - os: macos-latest
            build_command: 'flutter build ios --no-codesign'
            artifact_name: 'build-macos'
            artifact_path: 'flutter_app/build/ios/iphoneos/Runner.app'
          - os: windows-latest
            build_command: 'flutter build windows'
            artifact_name: 'build-windows'
            artifact_path: 'flutter_app/build/windows/runner/Debug/*'

    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Flutter app
        run: ${{ matrix.build_command }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
