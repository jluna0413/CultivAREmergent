{% extends "marketing/site.html" %}

{% block content %}
<div class="container mx-auto px-4 py-16 text-center">
    <h1 class="text-4xl font-bold text-red-600 mb-4">500 - Server Error</h1>
    <p class="text-xl text-gray-600 mb-8">Something went wrong on our end. Please try again later.</p>
    {% if detail %}
    <p class="text-md text-gray-500 mb-8">{{ detail }}</p>
    {% endif %}
    <a href="/" class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition">Go Home</a>
</div>
{% endblock %}
